services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Chicago
      TZ: America/Chicago
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_RESTRICT_FILE_ACCESS_TO: /data
      NODES_EXCLUDE: "[]"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data

  etl:
    build: ./etl
    container_name: ames_etl
    environment:
      RAW_DIR: /data/raw
    volumes:
      - ./ames-liquor-dashboard:/app
      - ./data:/data

volumes:
  n8n_data:
    external: true